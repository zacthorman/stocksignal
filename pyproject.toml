[project]
name = "stocksignal"
version = "0.1.0"
description = "A mechanical stock and ETF screener that turns a written trading rulebook into a daily signal digest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
live = [
    "yfinance>=0.2.40",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
stocksignal = "stocksignal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stocksignal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008 bans function calls in argument defaults, which is normally right.
# Typer's whole API is built on exactly that pattern, so it is a false positive
# here and nowhere else. Silence it narrowly rather than dropping the rule.
"src/stocksignal/cli.py" = ["B008"]
