# Continuous integration: every push to main runs lint, the test suite and an
# offline smoke test of the CLI, on two Python versions.
#
# It is close to "make lint && make test" but not identical, and the difference
# is deliberate: CI also runs the offline CLI smoke test at the bottom, which
# has no local equivalent.
#
# Why bother on a solo project? Two reasons. It proves the repo works on a
# machine that is not yours, which catches the "works because of something I
# installed in 2024" class of bug. And the green tick on the repo page is the
# first thing anyone technical looks at.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand from the Actions tab.
  #
  # Originally added as a workaround: for the first few days of this repo's
  # life, pushes to main did not start runs at all, while manual dispatch
  # worked fine. That cleared itself on 2026-08-09 with no change on this side,
  # which points at a new-account restriction on the GitHub end rather than
  # anything in this file. Kept because re-running a job by hand is useful in
  # its own right, not because the trigger is still broken.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # false: let both versions run to completion even if one fails, so a
      # single failing job still tells you the other version's result
      # instead of getting cancelled.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # Pinned to the exact release, not a floating major tag: this
        # project published floating v1 through v7 but has not published
        # one for v8 or v9, only exact tags exist there (checked
        # 2026-08-06), so v9.0.0 has to be pinned exactly.
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python ${{ matrix.python-version }} and create the venv
        # A real venv, not "uv pip install --system". --system was tested
        # locally and found to ignore the matrix version entirely: it
        # requires an actual system interpreter and skips over any uv
        # managed toolchain, so both matrix legs silently installed against
        # whatever Python happened to already be on the runner's PATH,
        # making the 3.11/3.12 split pointless. "uv venv --python X"
        # downloads that version if it is not already cached and creates
        # .venv against it, the same command "make setup" runs locally.
        # Putting .venv/bin on PATH means every later step in this job
        # picks it up automatically, each step is a fresh shell, so a
        # plain "source .venv/bin/activate" here would not survive to the
        # next one.
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install the project
        run: uv pip install -e ".[dev]"

      - name: Lint
        # Both halves of "make lint". The format check was missing here, so a
        # badly formatted file could pass CI and then fail the moment you ran
        # make lint locally. A check that is weaker than the local one is worse
        # than no check, because it teaches you to trust a green tick that has
        # not looked at everything.
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Test
        run: pytest --cov=stocksignal --cov-report=term-missing

      # The scan must work with no network and no keys. If this step ever
      # fails, someone has quietly made the tool depend on a live provider.
      - name: Smoke test the CLI offline
        run: stocksignal scan --tickers AAPL,MSFT,SPY
