# Continuous integration: every push runs the same checks you run locally.
#
# Why bother on a solo project? Two reasons. It proves the repo works on a
# machine that is not yours, which catches the "works because of something I
# installed in 2024" class of bug. And the green tick on the repo page is the
# first thing anyone technical looks at.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=stocksignal --cov-report=term-missing

      # The scan must work with no network and no keys. If this step ever
      # fails, someone has quietly made the tool depend on a live provider.
      - name: Smoke test the CLI offline
        run: stocksignal scan --tickers AAPL,MSFT,SPY
